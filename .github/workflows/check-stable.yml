name: check stable only

# 这个 tap 只跟稳定版。任何指向 pre-release 的改动都要在这里被挡住。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # brew style 只在 macOS runner 上有现成的 brew，用 ubuntu 的话得自己装。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: every cask must point at a stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_stable_only.py

      - name: the app names must match the upstream builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_app_names.py

      - name: the sync script must not lose track of what is stable
        run: python3 scripts/test_sync_releases.py

      - name: the casks must look right
        run: brew style .
